[package]
name = "luna-system-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "luna-system-runtime"
path = "src/main.rs"

[dependencies]
luna-app-runtime = { path = "../luna-app-runtime" }
luna-app-manager = { path = "../../system/luna-app-manager" }
luna-security = { path = "../luna-security" }
luna-namespace = { path = "../luna-namespace" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
luna-common = { path = "../luna-common" }
luna-event = { path = "../luna-event" }
luna-state = { path = "../luna-state" }
luna-system-manager = { path = "../luna-system-manager" }
luna-user-session = { path = "../luna-user-session" }
libc = "0.2"
