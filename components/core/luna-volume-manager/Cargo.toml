[package]
name = "luna-volume-manager"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "luna-volume-manager"
path = "src/main.rs"

[dependencies]
luna-common = { path = "../luna-common" }
luna-device-manager = { path = "../luna-device-manager" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
