[package]
name = "luna-app-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib_entry.rs"

[[bin]]
name = "luna-app-runtime"
path = "src/main.rs"

[dependencies]
luna-app-manager = { path = "../../system/luna-app-manager" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
luna-common = { path = "../luna-common" }
luna-volume-manager = { path = "../luna-volume-manager" }
luna-bundle = { path = "../luna-bundle" }
luna-root-mapping = { path = "../luna-root-mapping" }
luna-namespace = { path = "../luna-namespace" }
luna-security = { path = "../luna-security" }
luna-user-session = { path = "../luna-user-session" }

[dev-dependencies]
luna-system-runtime = { path = "../luna-system-runtime" }
