[package]
name = "luna-app-manager"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "luna-app-manager"
path = "src/main.rs"

[dependencies]
luna-common = { path = "../../core/luna-common" }
luna-bundle = { path = "../../core/luna-bundle" }
luna-security = { path = "../../core/luna-security" }
luna-state = { path = "../../core/luna-state" }
luna-update-manager = { path = "../../core/luna-update-manager" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
