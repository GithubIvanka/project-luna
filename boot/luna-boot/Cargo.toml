[package]
name = "luna-boot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Project Luna Contributors"]
description = "Minimal UEFI bootloader for Project Luna"

[workspace]

[dependencies]
uefi = { version = "0.40", features = ["alloc", "global_allocator", "logger", "panic_handler", "log-debugcon"] }
log = "0.4"
# UEFI's PE/COFF linker cannot consume the ELF objects emitted by BLAKE3's
# x86 assembly backend. Force the portable Rust implementation and prevent
# architecture-specific code generation in this target.
blake3 = { version = "1.8", default-features = false, features = ["pure", "prefer_intrinsics"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
