name: Diagnose app runtime authority build
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/p0-component-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt,clippy}
      - run: |
          set +e
          cargo check -p luna-security -p luna-app-runtime > p0-component-diagnostic.txt 2>&1
          echo check_status=$? >> p0-component-diagnostic.txt
          cargo test -p luna-security -p luna-app-runtime >> p0-component-diagnostic.txt 2>&1
          echo test_status=$? >> p0-component-diagnostic.txt
          cargo clippy -p luna-security -p luna-app-runtime --all-targets -- -D warnings >> p0-component-diagnostic.txt 2>&1
          echo clippy_status=$? >> p0-component-diagnostic.txt
          set -e
          rm .github/workflows/p0-component-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: record app runtime authority diagnostics"
          git push origin HEAD:sol/app-runtime-work
