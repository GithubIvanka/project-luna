name: Temporary Target Fix

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Patch current CI failures
        run: |
          python - <<'PY'
          from pathlib import Path

          secure = Path("components/luna-namespace/src/secure_mount.rs")
          text = secure.read_text()
          old = "use std::path::{Path, PathBun};"
          assert old in text
          secure.write_text(text.replace(old, "use std::path::{Path, PathBuf};", 1))

          plan = Path("components/luna-app-runtime/src/application_plan.rs")
          text = plan.read_text()
          old = "use std::path::{Component, Path, PathBuf};"
          assert old in text
          text = text.replace(old, "use std::path::{Path, PathBuf};", 1)
          old = '''        if !path.is_absolute()
            || path
                .components()
                .any(|component| matches!(component, Component::ParentDir | Component::CurDir))
            || path.as_os_str().to_string_lossy().contains('\\0')
            || path.to_str().is_none()
        {'''
          new = '''        if !path.is_absolute()
            || has_navigation_syntax(path)
            || path.as_os_str().to_string_lossy().contains('\\0')
            || path.to_str().is_none()
        {'''
          assert old in text
          text = text.replace(old, new, 1)
          marker = "\n#[cfg(test)]\nmod tests {"
          helper = '''\nfn has_navigation_syntax(path: &Path) -> bool {\n    path.to_string_lossy()\n        .split('/')\n        .any(|component| component == "." || component == "..")\n}\n'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)
          old = '''        manifest.add_capability("network");
        let plan = ApplicationPlan::new(
            manifest,
            valid_mapping(),'''
          new = '''        manifest.add_capability("network");
        let mut mapping = valid_mapping();
        mapping
            .insert(MappingRule::file(
                LogicalPath::new("/home/alice/config").unwrap(),
                PhysicalPath::new("/data/apps/example/config"),
            ))
            .unwrap();
        let plan = ApplicationPlan::new(
            manifest,
            mapping,'''
          assert old in text
          plan.write_text(text.replace(old, new, 1))

          runtime = Path("components/luna-app-runtime/src/application_plan_runtime.rs")
          text = runtime.read_text()
          old = "use std::path::{Component, Path, PathBuf};"
          assert old in text
          text = text.replace(old, "use std::path::{Path, PathBuf};", 1)
          old = '''    fn has_navigation_components(&self) -> bool {
        self.base_root
            .components()
            .chain(self.staging_parent.components())
            .any(|component| matches!(component, Component::CurDir | Component::ParentDir))
    }
}'''
          new = '''    fn has_navigation_components(&self) -> bool {
        has_navigation_syntax(&self.base_root) || has_navigation_syntax(&self.staging_parent)
    }
}

fn has_navigation_syntax(path: &Path) -> bool {
    path.to_string_lossy()
        .split('/')
        .any(|component| component == "." || component == "..")
}'''
          assert old in text
          runtime.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/luna-namespace/src/secure_mount.rs components/luna-app-runtime/src/application_plan.rs components/luna-app-runtime/src/application_plan_runtime.rs
          git commit -m "fix: close CI path validation regressions"
          git push origin HEAD:develop
