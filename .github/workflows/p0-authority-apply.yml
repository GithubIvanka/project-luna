name: Apply security-owned authorization boundary
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/p0-authority-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply authority ownership change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('components/luna-security/src/lib.rs')
          s = p.read_text()
          marker = '''pub trait PolicyAuthority {
              fn authorize(&self, request: &AuthorizationRequest) -> Result<Decision, SecurityError>;
          }
          '''
          addition = marker + '''
          /// Supplies the complete request set for one security decision.
          pub trait AuthorizationSource {
              fn authorization_requests(&self) -> Vec<AuthorizationRequest>;
          }

          /// A value sealed by `luna-security` after every request was allowed.
          #[derive(Clone, Debug)]
          pub struct Authorized<T> {
              value: T,
          }

          impl<T> Authorized<T> {
              pub fn value(&self) -> &T {
                  &self.value
              }

              pub fn into_value(self) -> T {
                  self.value
              }
          }

          /// The only constructor for `Authorized<T>`.
          pub fn authorize<T: AuthorizationSource>(
              policy: &dyn PolicyAuthority,
              value: T,
          ) -> Result<Authorized<T>, SecurityError> {
              for request in value.authorization_requests() {
                  match policy.authorize(&request)? {
                      Decision::Allow => {}
                      Decision::Deny => return Err(SecurityError::new(format!("denied: {request:?}"))),
                      Decision::Ask => return Err(SecurityError::new(
                          "authorization requires explicit user confirmation",
                      )),
                      Decision::Constrained { constraints } => return Err(SecurityError::new(format!(
                          "constraint enforcement is not available: {constraints:?}"
                      ))),
                  }
              }
              Ok(Authorized { value })
          }
          '''
          assert marker in s
          p.write_text(s.replace(marker, addition, 1))

          p = Path('components/luna-app-runtime/src/application_plan.rs')
          s = p.read_text()
          s = s.replace('''use luna_security::{
              AuthorizationRequest, Decision, Permission, PolicyAuthority, Principal, Resource, SecurityError,
          };''', '''use luna_security::{AuthorizationRequest, AuthorizationSource, Permission, Principal, Resource};''')
          s, n = re.subn(r'''    pub fn authorize\(\n        self,\n        policy: &dyn PolicyAuthority,\n    \) -> Result<AuthorizedApplicationPlan, PlanError> \{.*?\n    \}\n\n''', '', s, count=1, flags=re.S)
          assert n == 1
          start = s.index('#[derive(Clone, Debug)]\npub struct AuthorizedApplicationPlan')
          end = s.index('#[derive(Clone, Debug, Eq, PartialEq)]\npub enum PlanError', start)
          replacement = '''pub type AuthorizedApplicationPlan = luna_security::Authorized<ApplicationPlan>;

          pub fn authorize_application_plan(
              plan: ApplicationPlan,
              policy: &dyn luna_security::PolicyAuthority,
          ) -> Result<AuthorizedApplicationPlan, luna_security::SecurityError> {
              luna_security::authorize(policy, plan)
          }

          impl AuthorizationSource for ApplicationPlan {
              fn authorization_requests(&self) -> Vec<AuthorizationRequest> {
                  let mut requests = vec![AuthorizationRequest {
                      principal: Principal::Application(self.application.clone()),
                      resource: Resource::Runtime(self.runtime.kind()),
                      permission: Permission::Use,
                  }];
                  requests.extend(self.declared_requests());
                  requests.extend(self.requests.iter().cloned());
                  requests
              }
          }

          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace('    Security(String),\n', '')
          s = s.replace('            Self::Security(error) => write!(f, "authorization failed: {error}"),\n', '')
          s, n = re.subn(r'''fn require_allow\(.*?\n\}\n\n(?=fn has_navigation_syntax)''', '', s, count=1, flags=re.S)
          assert n == 1
          s = s.replace('use super::{ApplicationPlan, ExecutableSpec, PlanError};', 'use super::{ApplicationPlan, ExecutableSpec, PlanError, authorize_application_plan};')
          replacements = {
              'plan().authorize(&Deny)': 'authorize_application_plan(plan(), &Deny)',
              'plan.clone().authorize(&Deny)': 'authorize_application_plan(plan.clone(), &Deny)',
              'plan.authorize(&policy)': 'authorize_application_plan(plan, &policy)',
              'plan().authorize(&RuntimeDeny)': 'authorize_application_plan(plan(), &RuntimeDeny)',
              'plan().authorize(&Ask)': 'authorize_application_plan(plan(), &Ask)',
              'plan().authorize(&Constrained)': 'authorize_application_plan(plan(), &Constrained)',
              'plan().authorize(&Allow)': 'authorize_application_plan(plan(), &Allow)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          s = s.replace('authorized.application()', 'authorized.value().application()')
          s = s.replace('authorized.runtime()', 'authorized.value().runtime()')
          s = s.replace('authorized.executable()', 'authorized.value().executable()')
          p.write_text(s)

          for name in ['components/luna-app-runtime/src/lib.rs', 'components/luna-app-runtime/src/application_plan_runtime.rs']:
              p = Path(name); s = p.read_text()
              for method in ['session', 'mapping', 'runtime', 'manifest', 'application', 'version', 'executable', 'requests']:
                  s = s.replace(f'plan.{method}()', f'plan.value().{method}()')
              p.write_text(s)

          p = Path('components/luna-app-runtime/tests/application_plan_authorization.rs')
          s = p.read_text()
          s = s.replace('use luna_app_runtime::{ApplicationPlan, ExecutableSpec, PlanError};', 'use luna_app_runtime::{ApplicationPlan, ExecutableSpec, authorize_application_plan};')
          s = s.replace('plan(vec![explicit.clone()]).authorize(&policy)', 'authorize_application_plan(plan(vec![explicit.clone()]), &policy)')
          s = s.replace('plan(vec![first.clone(), second]).authorize(&policy)', 'authorize_application_plan(plan(vec![first.clone(), second]), &policy)')
          s = s.replace('Err(PlanError::Security(_))', 'Err(_)')
          s = s.replace('authorized.application()', 'authorized.value().application()')
          p.write_text(s)

          p = Path('components/luna-app-runtime/tests/contracts.rs')
          s = p.read_text()
          s = s.replace('ApplicationInstance, ApplicationInstanceId, ApplicationPlan, ApplicationRuntime, ExecutableSpec,', 'ApplicationInstance, ApplicationInstanceId, ApplicationPlan, ApplicationRuntime, ExecutableSpec,\n    authorize_application_plan,')
          s = s.replace('plan.session()', 'plan.value().session()')
          s = s.replace('plan.application()', 'plan.value().application()')
          s = s.replace('plan.version()', 'plan.value().version()')
          s = s.replace('plan.runtime()', 'plan.value().runtime()')
          s = s.replace('plan(&session).authorize(&AllowAll)', 'authorize_application_plan(plan(&session), &AllowAll)')
          s = s.replace('plan(&authorized_session)\n        .authorize(&AllowAll)', 'authorize_application_plan(plan(&authorized_session), &AllowAll)')
          s = s.replace('plan(&session).authorize(&DenyAll)', 'authorize_application_plan(plan(&session), &DenyAll)')
          p.write_text(s)

          p = Path('components/luna-app-runtime/src/lib_entry.rs')
          s = p.read_text().replace('pub use application_plan::{ApplicationPlan, AuthorizedApplicationPlan, ExecutableSpec, PlanError};', 'pub use application_plan::{\n    ApplicationPlan, AuthorizedApplicationPlan, ExecutableSpec, PlanError,\n    authorize_application_plan,\n};')
          p.write_text(s)
          PY
          rustfmt --edition 2024 components/luna-security/src/lib.rs components/luna-app-runtime/src/application_plan.rs components/luna-app-runtime/src/lib.rs components/luna-app-runtime/src/application_plan_runtime.rs components/luna-app-runtime/src/lib_entry.rs components/luna-app-runtime/tests/application_plan_authorization.rs components/luna-app-runtime/tests/contracts.rs
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit validated authority boundary
        run: |
          rm -f .github/workflows/p0-authority-apply.yml p0-authority-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(security): own application authorization sealing"
          git push origin HEAD:sol/app-runtime-work
