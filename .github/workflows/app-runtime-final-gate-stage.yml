name: Stage final app runtime P0 gate
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-final-gate-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt,clippy}
      - name: Apply final gate changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('components/luna-namespace/src/lib.rs'); s=p.read_text()
          s,n=re.subn(r'\n    /// Apply mappings at the caller.*?(?=\n    /// Enforce every mapping)', '\n', s, count=1, flags=re.S); assert n==1
          p.write_text(s)

          p=Path('components/luna-app-runtime/src/lib.rs'); s=p.read_text()
          needle='''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct ApplicationProcess {'''
          insert='''#[derive(Clone, Debug, Eq, PartialEq)]
          pub enum CleanupOutcome {
              Succeeded,
              Failed { message: String },
          }

          impl CleanupOutcome {
              pub fn is_success(&self) -> bool {
                  matches!(self, Self::Succeeded)
              }

              pub fn message(&self) -> Option<&str> {
                  match self {
                      Self::Succeeded => None,
                      Self::Failed { message } => Some(message),
                  }
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct ApplicationProcess {'''
          assert needle in s; s=s.replace(needle,insert,1)
          s=s.replace('''    failure: Option<InstanceFailure>,
          }''','''    failure: Option<InstanceFailure>,
              cleanup: Option<CleanupOutcome>,
          }''',1)
          s=s.replace('''            failure: None,
                  }''','''            failure: None,
                      cleanup: None,
                  }''',1)
          needle='''    pub fn failure(&self) -> Option<&InstanceFailure> {
                  self.failure.as_ref()
              }'''
          insert=needle+'''
              pub fn cleanup(&self) -> Option<&CleanupOutcome> {
                  self.cleanup.as_ref()
              }
              pub(crate) fn record_cleanup(&mut self, outcome: CleanupOutcome) {
                  self.cleanup = Some(outcome);
              }'''
          assert needle in s; s=s.replace(needle,insert,1)
          old='''                self.processes.remove(&process);
                          self.cleanup_root(process);
                          let instance = self.model.instance_mut(id)?;
                          instance.record_process_exit(status)?;
                          Ok(instance.state())'''
          new='''                self.processes.remove(&process);
                          let cleanup = self.cleanup_root(process);
                          let instance = self.model.instance_mut(id)?;
                          instance.record_process_exit(status)?;
                          instance.record_cleanup(cleanup);
                          Ok(instance.state())'''
          assert old in s; s=s.replace(old,new,1)
          old='''        self.processes.remove(&process);
                  self.cleanup_root(process);
                  self.model.instance_mut(id)?.record_requested_stop(status)'''
          new='''        self.processes.remove(&process);
                  let cleanup = self.cleanup_root(process);
                  let instance = self.model.instance_mut(id)?;
                  instance.record_requested_stop(status)?;
                  instance.record_cleanup(cleanup);
                  Ok(())'''
          assert old in s; s=s.replace(old,new,1)
          old='''                    if let Some(id) = self.processes.remove(&process) {
                                  self.cleanup_root(process);
                                  let instance = self.model.instance_mut(id)?;
                                  instance.record_process_exit(status)?;
                                  changes.push((id, instance.state()));
                              }'''
          new='''                    if let Some(id) = self.processes.remove(&process) {
                                  let cleanup = self.cleanup_root(process);
                                  let instance = self.model.instance_mut(id)?;
                                  instance.record_process_exit(status)?;
                                  instance.record_cleanup(cleanup);
                                  changes.push((id, instance.state()));
                              }'''
          assert old in s; s=s.replace(old,new,1)
          old='''    pub(crate) fn cleanup_root(&mut self, process: ProcessId) {
                  if let Some(root) = self.roots.remove(&process) {
                      let parent = root.parent().unwrap_or(Path::new("/tmp"));
                      let name = root.file_name().and_then(|v| v.to_str()).unwrap_or("root");
                      let support = parent.join(format!(".luna-namespace-{}-{}", process.get(), name));
                      let _ = fs::remove_dir_all(root);
                      let _ = fs::remove_dir_all(support);
                  }
              }'''
          new='''    pub(crate) fn cleanup_root(&mut self, process: ProcessId) -> CleanupOutcome {
                  let Some(root) = self.roots.remove(&process) else {
                      return CleanupOutcome::Succeeded;
                  };
                  let parent = root.parent().unwrap_or(Path::new("/tmp"));
                  let name = root.file_name().and_then(|v| v.to_str()).unwrap_or("root");
                  let support = parent.join(format!(".luna-namespace-{}-{}", process.get(), name));
                  let mut failures = Vec::new();
                  for path in [&root, &support] {
                      if let Err(error) = fs::remove_dir_all(path) {
                          if error.kind() != std::io::ErrorKind::NotFound {
                              failures.push(format!("{}: {error}", path.display()));
                          }
                      }
                  }
                  if failures.is_empty() {
                      CleanupOutcome::Succeeded
                  } else {
                      CleanupOutcome::Failed {
                          message: failures.join("; "),
                      }
                  }
              }'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('''        ApplicationInstance, ApplicationInstanceId, FailureStage, InstanceState, ProcessExit,
                  RuntimeError,
              };''','''        ApplicationInstance, ApplicationInstanceId, CleanupOutcome, FailureStage, InstanceState,
                  LinuxApplicationRuntime, ProcessExit, RuntimeError,
              };''',1)
          marker='''    #[test]
              fn terminal_states_cannot_return_to_running()'''
          tests='''    #[test]
              fn cleanup_failure_is_observable_without_losing_successful_exit() {
                  let mut instance = instance();
                  instance.transition(InstanceState::Starting).unwrap();
                  instance.attach_process(ProcessId::new(42)).unwrap();
                  instance.transition(InstanceState::Running).unwrap();
                  let status = Command::new("sh").args(["-c", "exit 0"]).status().unwrap();
                  instance.record_process_exit(status).unwrap();
                  instance.record_cleanup(CleanupOutcome::Failed {
                      message: "permission denied".into(),
                  });
                  assert_eq!(instance.state(), InstanceState::Stopped);
                  assert_eq!(instance.exit(), Some(ProcessExit::Exited { code: 0 }));
                  assert_eq!(instance.cleanup().unwrap().message(), Some("permission denied"));
              }

              #[test]
              fn remove_dir_failure_is_returned_by_cleanup_root() {
                  let mut runtime = LinuxApplicationRuntime::new();
                  let process = ProcessId::new(99);
                  runtime.roots.insert(process, std::path::PathBuf::from("/proc/self"));
                  let outcome = runtime.cleanup_root(process);
                  assert!(matches!(outcome, CleanupOutcome::Failed { .. }));
              }

          '''+marker
          assert marker in s; s=s.replace(marker,tests,1)
          p.write_text(s)

          p=Path('docs/architecture/components/LUNA-APP-RUNTIME.md'); s=p.read_text()
          s=s.replace('Stopping → Crashed\n','')
          s=s.replace('''        ├── cgroup placement
          ''','')
          s=s.replace('''        ├── final credentials/capabilities setup
          ''','')
          s=s.replace('''/etc /usr /lib /tmp /proc /sys /dev ...''','''/usr /lib /lib64 /tmp /proc /sys /dev ...''')
          s=s.replace('''После process exit runtime удаляет staging root и namespace support directory.''','''После process exit runtime пытается удалить staging root и namespace support directory. Результат cleanup сохраняется отдельно от process exit/crash outcome, поэтому cleanup failure наблюдаем и не скрывает исходный результат процесса.''')
          s=s.replace('''Linux integration дополнительно проверяет mount namespace lifecycle, process lifecycle и process reaping.''','''Privileged Linux integration запускает реальный динамический ELF через authorized launcher и проверяет отдельный mount namespace, fresh tmpfs `/`, trusted `/usr`/`/lib`/`/lib64`, authorized file/subtree mappings, kernel-enforced Landlock denial, FD policy и cleanup outcome.''')
          s=s.replace('''- process identity и exit/crash outcome сохраняются;''','''- process identity, exit/crash outcome и отдельный cleanup outcome сохраняются;''')
          p.write_text(s)

          p=Path('docs/contracts/APPLICATION-LAUNCH-CONTRACT.md'); s=p.read_text()
          s=s.replace('''An uncommitted staging root is removed on setup/spawn/attachment/transition failure. The runtime removes committed roots after process exit or requested termination. Cleanup errors are currently not surfaced and remain open work.''','''An uncommitted staging root is removed on setup/spawn/attachment/transition failure. After process exit or requested termination, cleanup produces an observable `CleanupOutcome` stored independently from the process exit/crash outcome, so cleanup failure cannot erase the original result.''')
          s=s.replace('''Privileged integration tests for real namespace/mount/chroot/Landlock behavior are not part of ordinary CI yet.''','''A dedicated privileged Linux CI suite launches a real dynamically linked ELF through the authorized launcher and verifies mount namespace isolation, fresh tmpfs root, trusted runtime access, mapping access, Landlock denials, FD inheritance policy, and cleanup outcome.''')
          s=s.replace('''- final credential, capability, device, `/proc`, `/sys`, `/run`, and inherited-FD policy;''','''- final credential, capability, device, `/proc`, `/sys`, and `/run` policy expansion;''')
          s=s.replace('''- observable cleanup failures and leaked-mount recovery;
          - removal or strict test-only restriction of the legacy whole-System-Image OverlayFS helper path;
          - privileged integration tests for real mount namespace, root transition, mount rollback, and Landlock enforcement.''','''- leaked-mount recovery beyond the observable cleanup outcome;
          - additional privileged coverage for forced mount rollback failures.''')
          s=s.replace('''Все FD >= 3 закрываются на final `execve()` по default-deny policy.''','''`CLOSE_RANGE_CLOEXEC` помечает все FD >= 3 close-on-exec; они закрываются ядром только при успешном final `execve()`. Разрешённых non-stdio runtime FD сейчас нет.''')
          p.write_text(s)

          p=Path('docs/decisions/ACCEPTED-DECISIONS.md'); s=p.read_text()
          s=s.replace('''- FD inheritance default-deny: только stdio, остальные FD закрываются на `execve()`.''','''- FD inheritance default-deny: stdio следует explicit `Command` policy; `CLOSE_RANGE_CLOEXEC` помечает FD >= 3, и ядро закрывает их при успешном `execve()`; разрешённых non-stdio runtime FD сейчас нет.''')
          p.write_text(s)
          PY
          cat > components/luna-app-runtime/tests/privileged_canonical_launch.rs <<'RS'
          #![cfg(target_os = "linux")]

          use std::fs;
          use std::os::unix::fs::MetadataExt;
          use std::path::{Path, PathBuf};
          use std::process::Command;
          use std::time::{Duration, SystemTime, UNIX_EPOCH};

          use luna_app_runtime::{
              ApplicationLaunchContext, ApplicationPlan, ApplicationPlanLauncher, CleanupOutcome,
              ExecutableSpec, InstanceState, LinuxApplicationRuntime, authorize_application_plan,
          };
          use luna_bundle::{BundleKind, BundleManifest, BundleMetadata, BundleResource, ResourceAccess};
          use luna_common::{BundleId, RuntimeSpec, UserId, Version};
          use luna_namespace::LinuxMountNamespace;
          use luna_root_mapping::{LogicalPath, MappingRule, MappingTable, PhysicalPath};
          use luna_security::{AuthorizationRequest, Decision, PolicyAuthority, SecurityError};
          use luna_system_runtime::SystemRuntimeService;
          use luna_user_session::{SessionId, SessionState, UserSession};

          struct AllowAll;
          impl PolicyAuthority for AllowAll {
              fn authorize(&self, _: &AuthorizationRequest) -> Result<Decision, SecurityError> {
                  Ok(Decision::Allow)
              }
          }

          struct Fixture {
              root: PathBuf,
              mounts: Vec<PathBuf>,
          }
          impl Fixture {
              fn new() -> Self {
                  let nonce = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos();
                  let root = PathBuf::from(format!("/tmp/luna-p0-{}-{nonce}", std::process::id()));
                  fs::create_dir_all(&root).unwrap();
                  Self { root, mounts: Vec::new() }
              }
              fn bind_runtime(&mut self, logical: &str) {
                  let source = fs::canonicalize(logical).unwrap();
                  let target = self.root.join("system").join(logical.trim_start_matches('/'));
                  fs::create_dir_all(&target).unwrap();
                  let status = Command::new("mount").args(["--bind"]).arg(source).arg(&target).status().unwrap();
                  assert!(status.success(), "bind mount for {logical} failed");
                  self.mounts.push(target);
              }
          }
          impl Drop for Fixture {
              fn drop(&mut self) {
                  for mount in self.mounts.iter().rev() {
                      let _ = Command::new("umount").args(["-l"]).arg(mount).status();
                  }
                  let _ = fs::remove_dir_all(&self.root);
              }
          }

          fn resource(manifest: &mut BundleManifest, path: &str, access: &[ResourceAccess]) {
              manifest.add_resource(BundleResource::new(path, path.trim_start_matches('/')).with_access(access.iter().copied()));
          }
          fn rule(table: &mut MappingTable, logical: &str, physical: &Path, subtree: bool, access: &[ResourceAccess]) {
              let logical = LogicalPath::new(logical).unwrap();
              let physical = PhysicalPath::new(physical);
              let rule = if subtree { MappingRule::subtree(logical, physical) } else { MappingRule::file(logical, physical) };
              table.insert(rule.with_access(access.iter().copied())).unwrap();
          }

          #[test]
          #[ignore = "requires root mount namespace privileges and Landlock ABI v3"]
          fn canonical_authorized_launch_is_kernel_enforced() {
              assert_eq!(unsafe { libc::geteuid() }, 0, "run with root privileges");
              let mut fixture = Fixture::new();
              fixture.bind_runtime("/usr");
              fixture.bind_runtime("/lib");
              fixture.bind_runtime("/lib64");
              let system = fixture.root.join("system");
              fs::write(system.join("system-secret"), "must-not-be-visible").unwrap();
              let app = fixture.root.join("app");
              let tree = app.join("tree");
              fs::create_dir_all(&tree).unwrap();
              fs::write(tree.join("value"), "tree-ok").unwrap();
              fs::write(app.join("allowed-file"), "file-ok").unwrap();
              fs::write(app.join("read-only"), "read-only").unwrap();
              fs::write(app.join("write-only"), "write-only").unwrap();
              fs::write(app.join("output"), "").unwrap();

              let source = fixture.root.join("probe.c");
              fs::write(&source, r#"
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/statfs.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>
          #define TMPFS_MAGIC 0x01021994
          static void die(int code) { _exit(code); }
          int main(int argc, char **argv) {
            struct statfs fs; struct stat ns; char buf[16] = {0}; int fd; pid_t child; int status;
            if (argc != 2 || statfs("/", &fs) || (unsigned long)fs.f_type != TMPFS_MAGIC) die(10);
            if (stat("/proc/self/ns/mnt", &ns) || (unsigned long long)ns.st_ino == strtoull(argv[1], 0, 10)) die(11);
            fd=open("/usr", O_RDONLY|O_DIRECTORY); if(fd<0) die(12); close(fd);
            fd=open("/lib", O_RDONLY|O_DIRECTORY); if(fd<0) die(13); close(fd);
            fd=open("/lib64", O_RDONLY|O_DIRECTORY); if(fd<0) die(14); close(fd);
            if (open("/usr/luna-write-denied", O_WRONLY|O_CREAT, 0600) >= 0) die(15);
            fd=open("/app/allowed-file", O_RDONLY); if(fd<0 || read(fd,buf,7)!=7 || memcmp(buf,"file-ok",7)) die(16); close(fd);
            memset(buf,0,sizeof(buf)); fd=open("/app/tree/value", O_RDONLY); if(fd<0 || read(fd,buf,7)!=7 || memcmp(buf,"tree-ok",7)) die(17); close(fd);
            errno=0; if(open("/app/write-only", O_RDONLY)>=0 || errno!=EACCES) die(18);
            errno=0; if(open("/app/read-only", O_WRONLY)>=0 || (errno!=EACCES && errno!=EROFS)) die(19);
            if(access("/system-secret", F_OK)==0) die(20);
            child=fork(); if(child<0) die(21);
            if(child==0){ execl("/app/no-exec","no-exec",argv[1],(char*)0); _exit(errno==EACCES?77:78); }
            if(waitpid(child,&status,0)<0 || !WIFEXITED(status) || WEXITSTATUS(status)!=77) die(22);
            fd=open("/app/output", O_WRONLY|O_TRUNC); if(fd<0 || write(fd,"PASS\n",5)!=5) die(23); close(fd);
            return 0;
          }
          "#).unwrap();
              let probe = app.join("probe");
              let status = Command::new("cc").args(["-O2", "-o"]).arg(&probe).arg(&source).status().unwrap();
              assert!(status.success());
              fs::copy(&probe, app.join("no-exec")).unwrap();

              let mut session = UserSession::new(SessionId::new(700), UserId::from("p0"));
              session.transition(SessionState::Authenticating).unwrap();
              session.login_succeeded().unwrap();
              let mut manifest = BundleManifest::new(BundleMetadata::new(BundleId::from("p0.probe"), Version::new(1,0,0), BundleKind::Application));
              resource(&mut manifest, "/app/probe", &[ResourceAccess::Execute]);
              resource(&mut manifest, "/app/no-exec", &[ResourceAccess::Read]);
              resource(&mut manifest, "/app/allowed-file", &[ResourceAccess::Read]);
              resource(&mut manifest, "/app/tree", &[ResourceAccess::Read]);
              resource(&mut manifest, "/app/read-only", &[ResourceAccess::Read]);
              resource(&mut manifest, "/app/write-only", &[ResourceAccess::Write]);
              resource(&mut manifest, "/app/output", &[ResourceAccess::Write]);
              let mut mappings = MappingTable::new();
              rule(&mut mappings, "/app/probe", &probe, false, &[ResourceAccess::Execute]);
              rule(&mut mappings, "/app/no-exec", &app.join("no-exec"), false, &[ResourceAccess::Read]);
              rule(&mut mappings, "/app/allowed-file", &app.join("allowed-file"), false, &[ResourceAccess::Read]);
              rule(&mut mappings, "/app/tree", &tree, true, &[ResourceAccess::Read]);
              rule(&mut mappings, "/app/read-only", &app.join("read-only"), false, &[ResourceAccess::Read]);
              rule(&mut mappings, "/app/write-only", &app.join("write-only"), false, &[ResourceAccess::Write]);
              rule(&mut mappings, "/app/output", &app.join("output"), false, &[ResourceAccess::Write]);
              let host_ns = fs::metadata("/proc/self/ns/mnt").unwrap().ino().to_string();
              let plan = ApplicationPlan::new(manifest, mappings, &session, RuntimeSpec::luna(), ExecutableSpec::new("/app/probe").with_args([host_ns]), vec![]).unwrap();
              let authorized = authorize_application_plan(plan, &AllowAll).unwrap();
              let context = ApplicationLaunchContext::new(LinuxMountNamespace, &system, fixture.root.join("staging")).with_trusted_source_root(&app);
              let mut system_runtime = SystemRuntimeService::new();
              system_runtime.start();
              let mut application_runtime = LinuxApplicationRuntime::new();
              let id = application_runtime.launch_authorized_plan(authorized, &session, &mut system_runtime, &context).unwrap();
              loop {
                  match application_runtime.poll(id, &mut system_runtime).unwrap() {
                      InstanceState::Running => std::thread::sleep(Duration::from_millis(10)),
                      InstanceState::Stopped => break,
                      state => panic!("probe terminated in {state:?}: {:?}", application_runtime.instance(id).unwrap().exit()),
                  }
              }
              assert_eq!(fs::read_to_string(app.join("output")).unwrap(), "PASS\n");
              let instance = application_runtime.instance(id).unwrap();
              assert!(matches!(instance.cleanup(), Some(CleanupOutcome::Succeeded)));
              assert!(!fixture.root.join("staging/instance-1").exists());
          }
          RS
          cat > .github/workflows/app-runtime-privileged.yml <<'YML'
          name: App runtime privileged P0
          on:
            pull_request:
              branches: [main, develop]
              paths:
                - components/luna-app-runtime/**
                - components/luna-namespace/**
                - components/luna-security/**
                - components/luna-root-mapping/**
                - components/luna-system-runtime/**
                - .github/workflows/app-runtime-privileged.yml
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            canonical-launch:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: dtolnay/rust-toolchain@stable
                - name: Build privileged integration target
                  run: cargo test -p luna-app-runtime --test privileged_canonical_launch --no-run
                - name: Run kernel-enforced canonical launch
                  run: sudo env PATH="$PATH" HOME="$HOME" CARGO_HOME="$HOME/.cargo" cargo test -p luna-app-runtime --test privileged_canonical_launch -- --ignored --exact canonical_authorized_launch_is_kernel_enforced
                - name: Confirm FD inheritance regression
                  run: cargo test -p luna-system-runtime supervised_exec_does_not_inherit_unapproved_fd -- --exact
          YML
          cargo fmt -- components/luna-app-runtime/src/lib.rs components/luna-app-runtime/tests/privileged_canonical_launch.rs components/luna-namespace/src/lib.rs
      - name: Audit and component validation
        run: |
          ! rg 'ApplicationPlan::authorize|NamespacePreparation|PreparedApplicationNamespace|prepare_authorized_namespace_for_session|materialize_logical_root' components
          ! rg 'mount_overlay|overlayfs|OverlayFS' components/luna-app-runtime components/luna-namespace
          ! rg 'fn apply_mappings|fn apply_mapping' components/luna-namespace/src
          cargo check -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime
          cargo test -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime
          cargo clippy -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --all-targets -- -D warnings
          cargo build -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --release
      - name: Commit final gate implementation
        run: |
          rm .github/workflows/app-runtime-final-gate-stage.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(app-runtime): add privileged canonical launch gate"
          git push origin HEAD:sol/app-runtime-work
