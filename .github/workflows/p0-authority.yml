name: Diagnose authority migration
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/p0-authority.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - name: Record source pattern diagnostics
        run: |
          python3 - <<'PY' > p0-authority-diagnostic.txt 2>&1
          from pathlib import Path
          import re
          sec = Path('components/luna-security/src/lib.rs').read_text()
          app = Path('components/luna-app-runtime/src/application_plan.rs').read_text()
          checks = {
            'security policy marker': 'pub trait PolicyAuthority {\n    fn authorize(&self, request: &AuthorizationRequest) -> Result<Decision, SecurityError>;\n}\n' in sec,
            'application security import': 'use luna_security::{\n    AuthorizationRequest, Decision, Permission, PolicyAuthority, Principal, Resource, SecurityError,\n};' in app,
            'authorize method regex': bool(re.search(r'    pub fn authorize\(\n        self,\n        policy: &dyn PolicyAuthority,\n    \) -> Result<AuthorizedApplicationPlan, PlanError> \{.*?\n    \}\n\n', app, re.S)),
            'authorized struct': '#[derive(Clone, Debug)]\npub struct AuthorizedApplicationPlan' in app,
            'helper regex': bool(re.search(r'fn require_allow\(.*?\n\}\n\nfn has_navigation_syntax', app, re.S)),
          }
          for key, value in checks.items(): print(key, value)
          PY
          rm -f .github/workflows/p0-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/p0-authority.yml p0-authority-diagnostic.txt
          git commit -m "ci: record authority migration diagnostics"
          git push origin HEAD:sol/app-runtime-work
