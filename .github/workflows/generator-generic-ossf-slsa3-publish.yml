name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build release subjects
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Build workspace release artifacts
        run: cargo build --workspace --release

      - name: Build luna-boot
        working-directory: boot/luna-boot
        run: cargo build --release --target x86_64-unknown-uefi

      - name: Collect release subjects
        run: |
          set -euo pipefail
          mkdir -p release-subjects
          cp boot/luna-boot/target/x86_64-unknown-uefi/release/luna-boot.efi release-subjects/
          tar -czf release-subjects/project-luna-workspace.tar.gz target/release

      - name: Generate subject hashes
        id: hash
        run: |
          set -euo pipefail
          hashes=$(sha256sum release-subjects/* | base64 -w0)
          echo "hashes=${hashes}" >> "${GITHUB_OUTPUT}"

      - name: Upload release subjects
        uses: actions/upload-artifact@v4
        with:
          name: project-luna-release-subjects
          path: release-subjects/
          if-no-files-found: error

  provenance:
    name: Generate SLSA3 provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
