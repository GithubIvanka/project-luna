name: sync desktop decisions into SoT

on:
  push:
    branches:
      - integration/desktop-session

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'chore(docs): sync desktop decisions into SoT' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/desktop-session

      - name: Patch Source of Truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/ARCHITECTURE.md")
          text = path.read_text(encoding="utf-8")

          old = """Обычный сценарий:\n\n```text\nPower\n ↓\nUEFI\n  ↓\nluna-boot.efi\n  ↓\nselected compatible kernel\n  ↓\nminimal RAM logical-root environment\n  ↓\nselected System Image\n  ↓\nattach DATA\n  ↓\nluna-system-runtime\n  ↓\nUserSession(s)\n```"""
          new = """Обычный сценарий:\n\n```text\nPower\n ↓\nUEFI\n  ↓\nluna-boot.efi\n  ↓\nselected compatible kernel\n  ↓\nminimal RAM logical-root environment\n  ↓\nselected System Image\n  ↓\nattach DATA\n  ↓\nluna-system-runtime\n  ↓\ngraphical login UserSession\n  ↓\nauthentication\n  ↓\nActive UserSession\n  ↓\nWayland session\n  ↓\nniri\n  ↓\nNoctalia Shell\n```\n\nШтатная загрузка Luna не использует TTY как пользовательскую точку входа.\nTTY/serial console может присутствовать только в development, diagnostic или recovery-сценариях."""
          if old in text:
              text = text.replace(old, new, 1)

          # Ensure the canonical DATA structure contains drivers.
          text = text.replace(
              "├── system/\n│   ├── apps/\n│   ├── libs/",
              "├── system/\n│   ├── apps/\n│   ├── drivers/\n│   ├── libs/",
              1,
          )
          text = text.replace(
              "data/system/\n├── apps/\n├── libs/",
              "data/system/\n├── apps/\n├── drivers/\n├── libs/",
              1,
          )

          marker = "\n# CURRENT DESKTOP SESSION MODEL\n"
          if marker not in text:
              text += """\n# CURRENT DESKTOP SESSION MODEL\n\nЭтот раздел фиксирует текущую реализационную модель графической системы Luna.\n\n```text\nluna-system-runtime\n        ↓\ngraphical login UserSession\n        ↓\nauthentication\n        ↓\nActive UserSession\n        ↓\nWayland session\n        ↓\nniri\n        ↓\nNoctalia Shell\n```\n\nЭкран входа является частью жизненного цикла `UserSession`. После успешной\nauthentication эта же `UserSession` переходит в `Active`, после чего запускается\nграфическая Wayland-сессия.\n\nTTY не является частью штатного пользовательского интерфейса или штатного способа\nзапуска рабочего стола. Serial/TTY доступ допускается только для разработки,\nдиагностики и Recovery.\n\n`niri` является compositor/window manager графической сессии, а `Noctalia Shell`\nявляется пользовательским desktop shell/UI. Они интегрируются в существующую\nмодель UserSession и system-runtime и не получают ответственность за системное\nсостояние, security policy или application installation.\n\n"""

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit SoT synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo "No SoT changes needed"
            exit 0
          fi
          git commit -m "chore(docs): sync desktop decisions into SoT"
          git push origin integration/desktop-session

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/_sync-desktop-sot.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove one-shot SoT sync workflow"
          git push origin integration/desktop-session
