name: Final app runtime P0 validation
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/p0-final-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt,clippy}
      - name: Repair tests and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/luna-app-runtime/tests/contracts.rs'); s=p.read_text()
          s,n=re.subn(r'\n    fn authorize\(\n        &self,.*?\n    \}\n', '\n', s, count=1, flags=re.S); assert n==1
          s,n=re.subn(r'\n    let request = AuthorizationRequest \{.*?\n    \);\n', '\n', s, count=1, flags=re.S); assert n==1
          p.write_text(s)
          p=Path('components/luna-namespace/src/lib.rs'); s=p.read_text()
          s=s.replace('use luna_common::{ResourceAccess, RuntimeProfile};\n    use luna_root_mapping', 'use luna_common::ResourceAccess;\n    use luna_root_mapping')
          p.write_text(s)
          PY
          rustfmt --edition 2024 components/luna-app-runtime/tests/contracts.rs components/luna-namespace/src/lib.rs
          cargo check -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime
          cargo test -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime
          cargo clippy -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --all-targets -- -D warnings
          cargo build -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --release
      - name: Commit validated result
        run: |
          rm -f .github/workflows/p0-final-validation.yml p0-repair-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(app-runtime): validate P0 launch hardening"
          git push origin HEAD:sol/app-runtime-work
