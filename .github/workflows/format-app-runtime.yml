name: Format app runtime changes

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/format-app-runtime.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatted app runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/luna-app-runtime/src/lib.rs \
                  components/luna-app-runtime/src/application_plan_runtime.rs \
                  components/luna-app-runtime/tests/contracts.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format app runtime lifecycle"
            git push origin HEAD:develop
          fi
