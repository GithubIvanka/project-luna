name: Finalize app runtime validation fixes

on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-cleanup.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Fix scoped warnings and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/luna-app-runtime/tests/contracts.rs')
          s = p.read_text()
          old = '''    let mut runtime = TestRuntime::default();

              assert!(plan(&session).authorize(&DenyAll).is_err());'''
          new = '''    let runtime = TestRuntime::default();

              assert!(plan(&session).authorize(&DenyAll).is_err());'''
          if old not in s:
              raise SystemExit('target unused mut not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rustfmt --edition 2024 components/luna-app-runtime/tests/contracts.rs components/luna-common/src/profile.rs components/luna-security/src/capability.rs components/luna-app-runtime/src/application_plan_runtime.rs components/luna-app-runtime/src/lib.rs
          cargo fmt --manifest-path components/luna-app-runtime/Cargo.toml -- --check
          cargo check --manifest-path components/luna-app-runtime/Cargo.toml
          cargo test --manifest-path components/luna-app-runtime/Cargo.toml
          cargo clippy --manifest-path components/luna-app-runtime/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Commit validated final state
        run: |
          rm -f .github/workflows/app-runtime-cleanup.yml app-runtime-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/app-runtime-cleanup.yml app-runtime-validation.txt components/luna-app-runtime/tests/contracts.rs components/luna-common/src/profile.rs components/luna-security/src/capability.rs components/luna-app-runtime/src/application_plan_runtime.rs components/luna-app-runtime/src/lib.rs
          git commit -m "test(app-runtime): clear validation warnings"
          git push origin HEAD:sol/app-runtime-work
