name: Rust CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Rustfmt check
    runs-on: ubuntu-latest
    continue-on-error: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref != 'main') }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check-and-test:
    name: Check and test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-
      - name: Build workspace
        run: cargo build --workspace --release

  luna-init:
    name: luna-init musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check luna-init
        run: cargo check --manifest-path components/luna-init/Cargo.toml --target x86_64-unknown-linux-musl
      - name: Build luna-init
        run: cargo build --release --manifest-path components/luna-init/Cargo.toml --target x86_64-unknown-linux-musl
      - name: Verify luna-init ELF
        run: file components/luna-init/target/x86_64-unknown-linux-musl/release/luna-init

  luna-boot:
    name: luna-boot UEFI build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') || github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            boot/luna-boot/target
          key: ${{ runner.os }}-luna-boot-${{ hashFiles('boot/luna-boot/Cargo.lock', 'boot/luna-boot/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-luna-boot-
      - name: Check bootloader
        run: cargo check --target x86_64-unknown-uefi
        working-directory: boot/luna-boot
      - name: Build bootloader
        run: cargo build --release --target x86_64-unknown-uefi
        working-directory: boot/luna-boot
      - name: Verify bootloader artifact
        run: test -f boot/luna-boot/target/x86_64-unknown-uefi/release/luna-boot.efi
      - name: Verify kernel integration files
        run: |
          test -f kernel/rust/luna_boot.rs
          test -f tools/apply-luna-kernel-overlay.sh
          test ! -e kernel/patches/0001-luna-kernel-rust-parser.patch
          test ! -e kernel/patches/0002-luna-kernel-rust-build.patch
          test ! -e kernel/patches/0003-luna-kernel-rust-bridge.patch
