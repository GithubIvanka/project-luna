name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply formatting for diagnostic baseline
        if: github.sha == 'ca51b9be7b079583b6cbf19ce46b81f5ee96e839'
        run: cargo fmt --all
      - name: Commit formatting baseline
        if: github.sha == 'ca51b9be7b079583b6cbf19ce46b81f5ee96e839'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format Rust sources with rustfmt"
          git push origin HEAD:main
      - name: Check formatting
        if: github.sha != 'ca51b9be7b079583b6cbf19ce46b81f5ee96e839'
        run: cargo fmt --all -- --check

  check-and-test:
    name: Check and test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-
      - name: Build workspace
        run: cargo build --workspace --release

  luna-boot:
    name: luna-boot UEFI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boot/luna-boot
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            boot/luna-boot/target
          key: ${{ runner.os }}-luna-boot-${{ hashFiles('boot/luna-boot/Cargo.lock', 'boot/luna-boot/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-luna-boot-
      - name: Check bootloader
        run: cargo check --target x86_64-unknown-uefi
      - name: Build bootloader
        run: cargo build --release --target x86_64-unknown-uefi
      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-boot-efi
          path: boot/luna-boot/target/x86_64-unknown-uefi/release/luna-boot.efi
          if-no-files-found: error
