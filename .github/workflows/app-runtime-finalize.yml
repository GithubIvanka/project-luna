name: Finalize application process metadata

on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - name: Add typed timing metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/luna-app-runtime/src/lib.rs')
          s = p.read_text()
          s = s.replace('use std::process::ExitStatus;\n', 'use std::process::ExitStatus;\nuse std::time::SystemTime;\n')
          s = s.replace('''pub struct ApplicationProcess {
              id: ProcessId,
              exit: Option<ProcessExit>,
          }''', '''pub struct ApplicationProcess {
              id: ProcessId,
              started_at: SystemTime,
              finished_at: Option<SystemTime>,
              exit: Option<ProcessExit>,
          }''')
          s = s.replace('''    pub const fn exit(&self) -> Option<ProcessExit> {
                  self.exit
              }

              pub const fn is_running''', '''    pub const fn exit(&self) -> Option<ProcessExit> {
                  self.exit
              }

              pub const fn started_at(&self) -> SystemTime {
                  self.started_at
              }

              pub const fn finished_at(&self) -> Option<SystemTime> {
                  self.finished_at
              }

              pub const fn is_running''')
          s = s.replace('''pub struct InstanceFailure {
              stage: FailureStage,
              message: String,
          }''', '''pub struct InstanceFailure {
              stage: FailureStage,
              occurred_at: SystemTime,
              message: String,
          }''')
          s = s.replace('''        Self {
                      stage,
                      message: message.into(),
                  }''', '''        Self {
                      stage,
                      occurred_at: SystemTime::now(),
                      message: message.into(),
                  }''', 1)
          s = s.replace('''    pub fn message(&self) -> &str {
                  &self.message
              }''', '''    pub const fn occurred_at(&self) -> SystemTime {
                  self.occurred_at
              }

              pub fn message(&self) -> &str {
                  &self.message
              }''')
          s = s.replace('''        self.process = Some(ApplicationProcess {
                      id: process,
                      exit: None,
                  });''', '''        self.process = Some(ApplicationProcess {
                      id: process,
                      started_at: SystemTime::now(),
                      finished_at: None,
                      exit: None,
                  });''')
          s = s.replace('''        self.process.as_mut().expect("process checked above").exit = Some(outcome);''', '''        let process = self.process.as_mut().expect("process checked above");
                  process.finished_at = Some(SystemTime::now());
                  process.exit = Some(outcome);''')
          s = s.replace('''        self.process.as_mut().expect("process checked above").exit =
                      Some(ProcessExit::from_status(&status));''', '''        let process = self.process.as_mut().expect("process checked above");
                  process.finished_at = Some(SystemTime::now());
                  process.exit = Some(ProcessExit::from_status(&status));''')
          p.write_text(s)
          PY
          rustup component add rustfmt clippy
          rustfmt --edition 2024 components/luna-app-runtime/src/lib.rs
          cargo check -p luna-app-runtime -p luna-security -p luna-common
          cargo test -p luna-app-runtime -p luna-security -p luna-common
          cargo clippy -p luna-app-runtime -p luna-security -p luna-common --all-targets --all-features -- -D warnings
      - name: Commit validated metadata and remove workflow
        run: |
          rm -f .github/workflows/app-runtime-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/app-runtime-finalize.yml components/luna-app-runtime/src/lib.rs
          git commit -m "feat(app-runtime): retain process and failure timestamps"
          git push origin HEAD:sol/app-runtime-work
