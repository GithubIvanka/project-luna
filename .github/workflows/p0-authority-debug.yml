name: Capture authority migration failure
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/p0-authority-debug.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and capture diagnostics
        run: |
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/p0-authority-apply.yml > /tmp/apply.py
          set +e
          python3 /tmp/apply.py > p0-authority-error.txt 2>&1
          echo "python_status=$?" >> p0-authority-error.txt
          rustfmt --edition 2024 components/luna-security/src/lib.rs components/luna-app-runtime/src/application_plan.rs components/luna-app-runtime/src/lib.rs components/luna-app-runtime/src/application_plan_runtime.rs components/luna-app-runtime/src/lib_entry.rs components/luna-app-runtime/tests/application_plan_authorization.rs components/luna-app-runtime/tests/contracts.rs >> p0-authority-error.txt 2>&1
          echo "rustfmt_status=$?" >> p0-authority-error.txt
          cargo check --workspace >> p0-authority-error.txt 2>&1
          echo "check_status=$?" >> p0-authority-error.txt
          set -e
          rm -f .github/workflows/p0-authority-apply.yml .github/workflows/p0-authority-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: capture authority migration failure"
          git push origin HEAD:sol/app-runtime-work
