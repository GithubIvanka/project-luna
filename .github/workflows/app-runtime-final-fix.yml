name: Fix final scoped app runtime gate
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-final-fix.yml]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt,clippy}
      - name: Fix scoped blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/luna-app-runtime/src/lib.rs'); s=p.read_text()
          old='''            if let Err(error) = fs::remove_dir_all(path) {
                          if error.kind() != std::io::ErrorKind::NotFound {
                              failures.push(format!("{}: {error}", path.display()));
                          }
                      }'''
          new='''            if let Err(error) = fs::remove_dir_all(path)
                          && error.kind() != std::io::ErrorKind::NotFound
                      {
                          failures.push(format!("{}: {error}", path.display()));
                      }'''
          assert old in s; p.write_text(s.replace(old,new,1))

          p=Path('components/luna-app-runtime/tests/privileged_canonical_launch.rs'); s=p.read_text()
          old='''    resource(&mut manifest, "/app/probe", &[ResourceAccess::Execute]);'''
          new='''    resource(
                  &mut manifest,
                  "/app/probe",
                  &[ResourceAccess::Read, ResourceAccess::Execute],
              );'''
          assert old in s; s=s.replace(old,new,1)
          old='''        &[ResourceAccess::Execute],
              );'''
          new='''        &[ResourceAccess::Read, ResourceAccess::Execute],
              );'''
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
          rustfmt --edition 2024 components/luna-app-runtime/src/lib.rs components/luna-app-runtime/tests/privileged_canonical_launch.rs
      - name: Scoped validation
        run: |
          rustfmt --edition 2024 --check components/luna-security/src/lib.rs components/luna-namespace/src/lib.rs components/luna-system-runtime/src/lib.rs components/luna-app-runtime/src/lib.rs components/luna-app-runtime/src/application_plan.rs components/luna-app-runtime/src/application_plan_runtime.rs components/luna-app-runtime/tests/application_plan.rs components/luna-app-runtime/tests/application_plan_authorization.rs components/luna-app-runtime/tests/contracts.rs components/luna-app-runtime/tests/privileged_canonical_launch.rs
          cargo check -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --all-targets
          cargo test -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --all-targets
          cargo clippy -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --all-targets --all-features -- -D warnings
          cargo build -p luna-security -p luna-namespace -p luna-system-runtime -p luna-app-runtime --release
          ! rg 'ApplicationPlan::authorize|NamespacePreparation|PreparedApplicationNamespace|prepare_authorized_namespace_for_session|materialize_logical_root' components
          ! rg 'mount_overlay|overlayfs|OverlayFS' components/luna-app-runtime components/luna-namespace
          ! rg 'fn apply_mappings|fn apply_mapping' components/luna-namespace/src
      - name: Privileged canonical launch
        run: sudo env PATH="$PATH" HOME="$HOME" CARGO_HOME="$HOME/.cargo" cargo test -p luna-app-runtime --test privileged_canonical_launch -- --ignored --exact canonical_authorized_launch_is_kernel_enforced
      - name: Commit clean validated tree
        run: |
          rm -f .github/workflows/app-runtime-final-fix.yml app-runtime-final-gate-diagnostic.txt app-runtime-scope-diagnostic.txt p0-final-diagnostic.txt p0-repair-diagnostic.txt p0-hardening-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(app-runtime): close final P0 validation blockers"
          git push origin HEAD:sol/app-runtime-work
