name: Apply final app runtime fixes
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-apply-final-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/luna-app-runtime/src/lib.rs')
          s=p.read_text()
          old='''            if let Err(error) = fs::remove_dir_all(path) {
                          if error.kind() != std::io::ErrorKind::NotFound {
                              failures.push(format!("{}: {error}", path.display()));
                          }
                      }'''
          # Normalize indentation encoded by YAML above to the source block.
          old='\n'.join([
              '            if let Err(error) = fs::remove_dir_all(path) {',
              '                if error.kind() != std::io::ErrorKind::NotFound {',
              '                    failures.push(format!("{}: {error}", path.display()));',
              '                }',
              '            }',
          ])
          new='\n'.join([
              '            if let Err(error) = fs::remove_dir_all(path)',
              '                && error.kind() != std::io::ErrorKind::NotFound',
              '            {',
              '                failures.push(format!("{}: {error}", path.display()));',
              '            }',
          ])
          if old not in s: raise SystemExit('cleanup block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('components/luna-app-runtime/tests/privileged_canonical_launch.rs')
          s=p.read_text()
          if s.count('&[ResourceAccess::Execute]') != 2:
              raise SystemExit('unexpected execute-only count')
          p.write_text(s.replace('&[ResourceAccess::Execute]', '&[ResourceAccess::Read, ResourceAccess::Execute]'))
          PY
          rustfmt --edition 2024 components/luna-app-runtime/src/lib.rs components/luna-app-runtime/tests/privileged_canonical_launch.rs
          rm -f .github/workflows/app-runtime-apply-final-fix.yml .github/workflows/app-runtime-final-fix.yml .github/workflows/app-runtime-final-repair.yml app-runtime-final-gate-diagnostic.txt app-runtime-scope-diagnostic.txt p0-final-diagnostic.txt p0-repair-diagnostic.txt p0-hardening-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(app-runtime): close scoped validation blockers"
          git push origin HEAD:sol/app-runtime-work
