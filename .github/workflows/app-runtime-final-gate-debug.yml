name: Diagnose final app runtime gate
on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/app-runtime-final-gate-debug.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: sol/app-runtime-work}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt,clippy}
      - run: |
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/app-runtime-final-gate-stage.yml > /tmp/apply.py
          set +e
          python3 /tmp/apply.py > app-runtime-final-gate-diagnostic.txt 2>&1
          echo python_status=$? >> app-runtime-final-gate-diagnostic.txt
          set -e
          rm -f .github/workflows/app-runtime-final-gate-stage.yml .github/workflows/app-runtime-final-gate-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: record final app runtime gate diagnostic"
          git push origin HEAD:sol/app-runtime-work
