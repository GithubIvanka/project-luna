name: _apply-musl-init-integration
on:
  push:
    branches:
      - integration/musl-init-enforcement
permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs(runtime): enforce musl-native system userspace and init boundary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply musl and init contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          builder = Path('boot/luna-boot/tests/ovmf/build-userspace.sh')
          text = builder.read_text()
          start = text.index('RUNTIME_TARGET=')
          end = text.index('\ncp "$BUSYBOX"', start)
          replacement = '''RUNTIME_TARGET="x86_64-unknown-linux-musl"
if ! command -v rustup >/dev/null; then
    echo "luna-test userspace: rustup is required to provision the musl target" >&2
    exit 1
fi
if ! rustup target list --installed | grep -qx "$RUNTIME_TARGET"; then
    echo "luna-test userspace: installing Rust target $RUNTIME_TARGET" >&2
    rustup target add "$RUNTIME_TARGET"
fi
cargo build --release -p luna-system-runtime --target "$RUNTIME_TARGET"
RUNTIME="$REPO_ROOT/target/$RUNTIME_TARGET/release/luna-system-runtime"
[ -x "$RUNTIME" ] || { echo "runtime binary was not produced: $RUNTIME" >&2; exit 1; }
if file "$RUNTIME" | grep -qv 'statically linked'; then
    echo "luna-test userspace: system-runtime must be statically linked with musl" >&2
    exit 1
fi
'''
          builder.write_text(text[:start] + replacement + text[end:])

          status = Path('STATUS.md')
          s = status.read_text()
          marker = '### Runtime/libc and init contract\n'
          if marker not in s:
              s += '''\n### Runtime/libc and init contract\n\nLuna uses **musl libc as the native system userspace libc**. The QEMU bring-up builder now requires the Rust `x86_64-unknown-linux-musl` target and no longer falls back to a glibc-linked system-runtime build. glibc is reserved for the separately managed compatibility-runtime path.\n\n`luna-init` is the narrow early-userspace handoff layer. It prepares the selected System Image, DATA and required kernel virtual filesystems, then transfers control to `luna-system-runtime` as the permanent PID 1 supervisor.\n'''
              status.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          marker = '## Runtime/libc and init\n'
          if marker not in r:
              r += '''\n## Runtime/libc and init\n\nLuna uses **musl libc as the native system userspace libc**. glibc is an optional, versioned compatibility runtime materialized only inside approved application namespaces. A single process uses one selected libc environment.\n\n`luna-init` is the small early-userspace handoff stage between the Linux kernel and the permanent `luna-system-runtime` PID 1 supervisor.\n'''
              readme.write_text(r)

          sot = Path('docs/ARCHITECTURE.md')
          a = sot.read_text()
          if '# 109. Runtime, libc and init architecture' not in a:
              a += '''\n\n---\n\n# 109. Runtime, libc and init architecture\n\n## 109.1 Native system libc\n\nThe native Luna userspace uses **musl libc**. Luna system components, the early userspace and the permanent system runtime are built and run against the native musl environment. The choice is architectural: it keeps the immutable system base compact, predictable and easy to compose.\n\nPerformance is an important property, but the architecture does not claim that musl is universally faster than glibc for every workload.\n\n## 109.2 glibc compatibility runtime\n\nglibc is an optional Luna-managed compatibility runtime for applications that require GNU libc. It is versioned independently from the Luna system libc and is materialized only in namespaces that request and are authorized for it. It is never the global system libc.\n\nDifferent processes may use musl or glibc concurrently. A process does not treat musl and glibc as interchangeable versions of the same libc environment.\n\n## 109.3 Runtime selection\n\nAn application may request a logical runtime class:\n\n```text\nluna\nglibc\nbundle\n```\n\nThe declaration is a request, not authorization. Runtime selection is resolved through Luna-managed sources, mapping validation and security authorization before namespace materialization.\n\nPhysical runtime/library locations are implementation details and are not part of the application's logical filesystem contract.\n\n## 109.4 luna-init\n\n`luna-init` is the specialized early-userspace handoff layer. Its responsibilities are limited to boot-time preparation:\n\n```text\nLinux kernel\n    ↓\nluna-init\n    ├── discover/validate SYSTEM\n    ├── locate selected SquashFS System Image\n    ├── construct initial logical root\n    ├── attach DATA\n    ├── prepare /dev, /proc and /sys\n    └── transfer control\n            ↓\nluna-system-runtime (PID 1)\n```\n\n`luna-init` is not the service manager, application manager or package manager.\n\n## 109.5 Permanent system runtime\n\n`luna-system-runtime` is the permanent PID 1 and the sole system-wide process supervisor. It owns service lifecycle, dependency/readiness state, restart policy, child-process ownership, resource supervision and `UserSession` orchestration.\n\n`luna-app-runtime` owns application-instance lifecycle and uses the system runtime for process operations; it does not create a competing supervisor.\n\n## 109.6 Normal desktop boot\n\nTTY is not a normal user-facing boot/session boundary. The normal startup path is graphical:\n\n```text\nUEFI\n ↓\nluna-boot.efi\n ↓\nLinux kernel\n ↓\nluna-init\n ↓\nlogical root + DATA\n ↓\nluna-system-runtime (PID 1)\n ↓\ngraphical login / UserSession(Authenticating)\n ↓\nauthentication\n ↓\nUserSession(Active)\n ↓\nWayland\n ↓\nniri\n ↓\nNoctalia Shell\n```\n\nTTY/serial access is reserved for development, diagnostics and recovery tooling.\n\n## 109.7 Invariants\n\n1. musl is the native system libc.\n2. glibc is a separate compatibility runtime.\n3. One process uses one selected libc environment.\n4. Runtime choice cannot weaken Security policy.\n5. Runtime source paths are hidden behind logical mappings.\n6. Authorization and mapping validation precede namespace materialization.\n7. `luna-init` is early userspace only.\n8. `luna-system-runtime` is the permanent PID 1 and sole process supervisor.\n9. The normal user session begins at the graphical login boundary, not through TTY.\n10. The canonical DATA system tree includes `drivers/`.\n\n## 109.8 Current implementation rule\n\nThe development userspace builder must target `x86_64-unknown-linux-musl` for `luna-system-runtime`. It must fail rather than silently substitute a glibc-linked native system runtime. glibc compatibility support is implemented separately as a managed per-process runtime.\n'''
              sot.write_text(a)
          PY

          chmod +x boot/luna-boot/tests/ovmf/build-userspace.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boot/luna-boot/tests/ovmf/build-userspace.sh STATUS.md README.md docs/ARCHITECTURE.md
          git commit -m "docs(runtime): enforce musl-native system userspace and init boundary"
          git rm .github/workflows/_apply-musl-init-integration.yml
          git commit -m "chore(ci): remove temporary musl integration workflow"
          git push
