name: Temporary Rustfmt Artifact

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Pack formatted sources
        run: |
          tar -czf /tmp/formatted-sources.tar.gz \
            components/luna-app-runtime/src/application_plan.rs \
            components/luna-app-runtime/src/application_plan_runtime.rs \
            components/luna-namespace/src/lib.rs \
            components/luna-root-mapping/src/lib.rs \
            components/luna-security/src/lib.rs
      - name: Upload formatted sources
        uses: actions/upload-artifact@v6
        with:
          name: formatted-sources
          path: /tmp/formatted-sources.tar.gz
