name: Temporary Rustfmt Artifact

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/luna-app-runtime/src/application_plan.rs \
            components/luna-app-runtime/src/application_plan_runtime.rs \
            components/luna-namespace/src/lib.rs \
            components/luna-root-mapping/src/lib.rs \
            components/luna-security/src/lib.rs
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: apply rustfmt to namespace and runtime sources"
            git push origin HEAD:develop
          fi
