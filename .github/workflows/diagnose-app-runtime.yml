name: Finalize scoped runtime corrections

on:
  push:
    branches: [sol/app-runtime-work]
    paths: [.github/workflows/diagnose-app-runtime.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/app-runtime-work
      - name: Apply and commit corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('components/luna-app-runtime/src/lib.rs')
          s = p.read_text()
          s = s.replace('use luna_bundle::{BundleManifest, validate_manifest};', 'use luna_bundle::validate_manifest;')
          p.write_text(s)

          p = Path('components/luna-app-runtime/src/application_plan_runtime.rs')
          s = p.read_text()
          s = s.replace('use luna_security::{CapabilityName, CapabilityRegistry, Principal};', 'use luna_security::{CapabilityName, CapabilityRegistry};')
          old = '''    let registry = CapabilityRegistry::with_default_providers();
              let principal = Principal::Application(plan.application().clone());
              for capability in plan.manifest().capabilities() {
                  let name = CapabilityName::new(capability.to_owned())
                      .map_err(|error| RuntimeError::Security(error.to_string()))?;
                  // The plan has already passed policy authorization. This second step
                  // only verifies that the approved capability has a registered provider.
                  registry
                      .grant(principal.clone(), name)
                      .map_err(|error| RuntimeError::Security(error.to_string()))?;
              }
          '''
          new = '''    let registry = CapabilityRegistry::with_default_providers();
              for capability in plan.manifest().capabilities() {
                  let name = CapabilityName::new(capability.to_owned())
                      .map_err(|error| RuntimeError::Security(error.to_string()))?;
                  // The plan already carries policy authorization. Registry lookup only
                  // verifies that the approved capability has a provider.
                  if registry.provider_for(&name).is_none() {
                      return Err(RuntimeError::Security(format!(
                          "unknown capability provider: {name}"
                      )));
                  }
              }
          '''
          if old not in s:
              raise SystemExit('expected capability validation block missing')
          p.write_text(s.replace(old, new))
          PY
          rustup component add rustfmt
          rustfmt --edition 2024 components/luna-app-runtime/src/lib.rs components/luna-app-runtime/src/application_plan_runtime.rs
          rm -f .github/workflows/diagnose-app-runtime.yml ci-app-runtime-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/diagnose-app-runtime.yml ci-app-runtime-report.txt components/luna-app-runtime/src/lib.rs components/luna-app-runtime/src/application_plan_runtime.rs
          git commit -m "fix(app-runtime): keep provider lookup separate from authorization"
          git push origin HEAD:sol/app-runtime-work
